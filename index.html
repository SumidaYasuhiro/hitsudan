<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>えんかく筆談ボード</title>
    <!-- PeerJSのライブラリを読み込み -->
    <!-- <script src="https://unpkg.com"></script> -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #333333; /* 背景をダークグレーにして縦長ノートを引き立たせます */
            font-family: sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* ホワイトボード（iPad縦向きの比率に固定し、画面中央にフィットさせる） */
        canvas {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: crosshair;
        }
        #clear-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 160px;
            height: 80px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #clear-btn:active {
            background-color: #cc0000;
            transform: translateY(2px);
        }
        #status-lamp {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #ccc;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="status-lamp"></div>
    <!-- 縦持ち用に幅768、高さ1024でキャンバスの大きさを完全固定 -->
    <canvas id="board" width="768" height="1024"></canvas>
    <button id="clear-btn">ぜんぶけす</button>

<script>
    const ROOM_PREFIX = 'kazoku-hitudan-sumida-'; 
    
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');

    const myId = (role === 'parent') ? ROOM_PREFIX + 'parent' : ROOM_PREFIX + 'me';
    const targetId = (role === 'parent') ? ROOM_PREFIX + 'me' : ROOM_PREFIX + 'parent';
    const myColor = (role === 'parent') ? '#000000' : '#0000ff';

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let conn = null;

    // 初期の線の設定
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // マウスやペンの座標を、固定されたキャンバス内の正しい座標に変換する関数
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        return { x, y };
    }

    // --- PeerJS 接続処理 ---
    const peer = new Peer(myId);
    const statusLamp = document.getElementById('status-lamp');

    peer.on('open', () => {
        statusLamp.style.backgroundColor = '#ffcc00';
        if (role !== 'parent') { connectToTarget(); }
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });

    function connectToTarget() {
        conn = peer.connect(targetId, { reliable: true });
        setupConnection();
    }

    function setupConnection() {
        conn.on('open', () => { statusLamp.style.backgroundColor = '#00cc66'; });

        conn.on('data', (data) => {
            if (data.type === 'draw') {
                drawRemote(data);
            } else if (data.type === 'clear') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        conn.on('close', () => {
            statusLamp.style.backgroundColor = '#cc0000';
            if (role !== 'parent') { setTimeout(connectToTarget, 10000); }
        });
    }

    // --- お絵描き処理（縦持ち・ズレ対策版） ---
    document.addEventListener('gesturestart', (e) => e.preventDefault());

    canvas.addEventListener('pointerdown', (e) => {
        isDrawing = true;
        const coords = getCanvasCoords(e);
        ctx.beginPath();
        ctx.moveTo(coords.x, coords.y);
        sendDrawData('start', coords.x, coords.y);
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        const coords = getCanvasCoords(e);
        ctx.strokeStyle = myColor;
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();
        sendDrawData('move', coords.x, coords.y);
    });

    canvas.addEventListener('pointerup', () => {
        isDrawing = false;
        sendDrawData('end', 0, 0);
    });

    function sendDrawData(action, x, y) {
        if (conn && conn.open) {
            conn.send({
                type: 'draw',
                action: action,
                x: x / canvas.width,
                y: y / canvas.height,
                color: myColor
            });
        }
    }

    function drawRemote(data) {
        const realX = data.x * canvas.width;
        const realY = data.y * canvas.height;

        ctx.strokeStyle = data.color;
        if (data.action === 'start') {
            ctx.beginPath();
            ctx.moveTo(realX, realY);
        } else if (data.action === 'move') {
            ctx.lineTo(realX, realY);
            ctx.stroke();
        }
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (conn && conn.open) { conn.send({ type: 'clear' }); }
    });
</script>
</body>
</html>
